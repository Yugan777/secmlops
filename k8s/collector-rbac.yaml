apiVersion: v1
kind: ServiceAccount
metadata:
  name: secmlops-collector
  namespace: secmlops

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secmlops-collector
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secmlops-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secmlops-collector
subjects:
  - kind: ServiceAccount
    name: secmlops-collector
    namespace: secmlops
